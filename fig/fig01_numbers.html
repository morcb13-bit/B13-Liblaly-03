<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>整数を並べる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 平面の上の13段の三角形の円環に、段の整数1〜13を書いて並べる */
:root{
  --bg:#efede6; --panel:#f8f7f2; --ink:#1e2724; --muted:#5d6660; --rule:#cfcabd;
  --c0:#e0b030; --c1:#1f5fa8; --c2:#b0452a; --c3:#3d7d4f; --c4:#6a4e9b; --edge:#39443f; --hl:#1e2724;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151a18; --panel:#1d2421; --ink:#e6ebe7; --muted:#9aa6a0; --rule:#36403b;
  --c4:#d9d6cc; --edge:#0d110f; --hl:#f0c53a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151a18; --panel:#1d2421; --ink:#e6ebe7; --muted:#9aa6a0; --rule:#36403b;
  --c4:#d9d6cc; --edge:#0d110f; --hl:#f0c53a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);margin:0;padding-inline:16px;padding-block:16px 28px}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:14px}
.box{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:12px;display:grid;gap:10px;min-width:0}
canvas{width:100%;max-width:560px;aspect-ratio:1/1;height:auto;justify-self:center}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 14px}
.kv div{display:grid;gap:2px}
.kv span{font-size:.78rem;color:var(--muted);letter-spacing:.06em}
.kv b{font-family:var(--mono);font-weight:600;font-size:1.1rem;font-variant-numeric:tabular-nums}
.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{font:inherit;font-weight:700;color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
label{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.35rem,4vw,1.8rem);margin:0;letter-spacing:.02em}
p{margin:0;line-height:1.75;color:var(--ink)}
.note{font-size:.85rem;color:var(--muted);line-height:1.65}
code{font-family:var(--mono);font-size:.9em}
</style>
</head>
<body>
<div class="wrap">
  <h1>整数を並べる</h1>
  <div class="box">
    <canvas id="cv" width="1000" height="1000" aria-label="円環を1から13まで積んだ三角形と、それを10方向に組んだ平面"></canvas>
    <div class="controls">
      <button id="play">停止</button>
      <button id="step">一コマ</button>
      <button id="reset">はじめから</button>
      <label>速さ <input id="speed" type="range" min="1" max="8" value="3"></label>
    </div>
    <div class="kv">
      <div><span>段階</span><b id="ph">—</b></div>
      <div><span>段（数）</span><b id="nn">—</b></div>
      <div><span>円環・残り</span><b id="ag">—</b></div>
      <div><span>列</span><b id="tt">—</b></div>
    </div>
  </div>
  <p>五角形の平面の一部、13 段の三角形を、扇の頂点が上に来るように平面ごと回して描いています（回しただけで、タイルの並びは変えていません）。まず頂点の五芒星に最初の 1、そのすぐ下の段 1 の円環に 2 番目の 1 を書き、段 n の円環（五角形 10 枚の輪）それぞれに整数 n を書きます。段 n には円環が n 個あります。</p>
  <p class="note">円環の位置・つなぎ方・折れ角・φⁿ の組は、すべて整数の番地と足し算だけで決めています。画面の座標に直す最後の一回だけ、観察者側の表示として実数を使っています。</p>
</div>

const PHI=[1,0,1,-1];
function mul(a,b){const c=Array(8).fill(0);for(let i=0;i<4;i++)if(a[i])for(let j=0;j<4;j++)c[i+j]+=a[i]*b[j];const r=[c[0],c[1],c[2],c[3]];r[3]+=c[4];r[2]-=c[4];r[1]+=c[4];r[0]-=c[4];r[0]-=c[5];r[1]-=c[6];r[2]-=c[7];return r;}
const rot=(a,k)=>mul(a,POW[((k%10)+10)%10]);
const STEP=[...Array(10)].map((_,j)=>mul(PHI,POW[j]));
const IDX=new Map(CELLS.map((c,i)=>[key(c),i])),N=CELLS.length;
const VO=CELLS.map(c=>{for(let j=0;j<10;j++)if(IDX.has(key(add(c,STEP[j]))))return 1-j%2;});
const verts=(c,o)=>[0,1,2,3,4].map(i=>add(c,POW[(o+2*i)%10]));
const POWS=[[1,0]];for(let n=1;n<=6;n++){const[p,q]=POWS[n-1];POWS.push([q,p+q]);}
const RN=[[1,0,0,0]];for(let n=1;n<=6;n++)RN.push(mul(RN[n-1],PHI));
const OFF=[null,0,1,0,0,0,0];
// ── 観察者側の表示 ──
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const Z=[...Array(4)].map((_,k)=>[Math.cos(Math.PI*k/5),Math.sin(Math.PI*k/5)]);
const xy=a=>[a[0]+a[1]*Z[1][0]+a[2]*Z[2][0]+a[3]*Z[3][0],a[1]*Z[1][1]+a[2]*Z[2][1]+a[3]*Z[3][1]];
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const ca=Math.cos(-Math.PI/10),sa=Math.sin(-Math.PI/10);
const flat=a=>{const[x,y]=xy(a);return[x*ca-y*sa,x*sa+y*ca];};
const COLS=["--c0","--c1","--c2","--c3","--c4"];
const FR=[{m:"lay",n:0},{m:"lay",n:0}];for(let n=1;n<=13;n++)FR.push({m:"lay",n});FR.push({m:"lay",n:13});FR.push({m:"lay",n:13});
const sieveCol=(n,cols,cR)=>n===1?cR:n%2===0?cols[1]:n%3===0?cols[3]:cols[0];
const PH2=mul(PHI,PHI);
function ringCells(c){return[...Array(10).keys()].map(k=>add(c,rot(PH2,k)));}
function drawTiling(P,cR,cP){for(let i=0;i<N;i++){const[X,Y]=P(CELLS[i]);if(X<-60||X>1060||Y<-60||Y>1060)continue;const pts=verts(CELLS[i],VO[i]).map(P);ctx.beginPath();ctx.moveTo(...pts[0]);for(let t=1;t<5;t++)ctx.lineTo(...pts[t]);ctx.closePath();ctx.fillStyle=cR;ctx.globalAlpha=0.45;ctx.fill();ctx.globalAlpha=1;ctx.lineWidth=0.8;ctx.strokeStyle=cP;ctx.stroke();}}
function fillRing(c,col,P,alpha){for(const q of ringCells(c)){const i=IDX.get(key(q));if(i===undefined)continue;const pts=verts(CELLS[i],VO[i]).map(P);ctx.beginPath();ctx.moveTo(...pts[0]);for(let t=1;t<5;t++)ctx.lineTo(...pts[t]);ctx.closePath();ctx.fillStyle=col;ctx.globalAlpha=alpha;ctx.fill();ctx.globalAlpha=1;}}
function star(P,cI,r){const[X,Y]=P([0,0,0,0]);ctx.beginPath();for(let i=0;i<10;i++){const rr=i%2?r*0.42:r,th=Math.PI/2+i*Math.PI/5;i?ctx.lineTo(X+rr*Math.cos(th),Y-rr*Math.sin(th)):ctx.moveTo(X+rr*Math.cos(th),Y-rr*Math.sin(th));}ctx.closePath();ctx.fillStyle=cI;ctx.fill();}
function draw(f){
  ctx.clearRect(0,0,1000,1000);const cI=css("--ink"),cR=css("--rule"),cP=css("--panel"),cols=COLS.map(css),g=id=>document.getElementById(id);
  // 平面ごと回して、扇の頂点を上、三角形を下へまっすぐ広げる（回すだけで、位置関係は変えない）
  let gx=0,gy=0;DATA.tri0.flat().forEach(c=>{const[x,y]=xy(c);gx+=x;gy+=y;});
  const al=-Math.PI/2-Math.atan2(gy,gx),ca=Math.cos(al),sa=Math.sin(al),R=a=>{const[x,y]=xy(a);return[x*ca-y*sa,x*sa+y*ca];};
  const all=DATA.tri0.flat().concat([[0,0,0,0]]).map(R),xs=all.map(p=>p[0]),ys=all.map(p=>p[1]);
  const cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;
  const span=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys))/2+3,SC=480/span,P=a=>{const[x,y]=R(a);return[500+(x-cx)*SC,500-(y-cy)*SC];};
  drawTiling(P,cR,cP);
  const top=f.m==="lay"?f.n:13;
  // 行ごとの色と濃さ
  let colOf=n=>[cols[0],n===f.n?0.9:0.55],starCol=[cols[0],0.95],lab=n=>1;
  const FIB=[[0,1,2],[1,2,3],[2,3,5],[3,5,8],[5,8,13]];
  if(f.m==="fib"){const[x,y,z]=FIB[f.k],done=[1,2,3,5,8,13].filter(v=>v<=z);
    colOf=n=>n===z?[cols[2],0.9]:(n===x||n===y)?[cols[1],0.85]:done.includes(n)?[cols[0],0.6]:[cR,0.25];
    starCol=x===0?[cols[1],0.95]:[cols[0],0.8];lab=n=>(done.includes(n)||n===x||n===y)?1:0.35;}
  if(f.m==="sieve"){const s=f.s;
    colOf=n=>{if(s>=1&&n%2===0)return[cols[1],0.75];if(s>=2&&n%3===0)return[cols[3],0.75];if(s>=3)return n===1?[cols[0],0.9]:[cols[2],0.9];return[cR,0.4];};
    starCol=[cR,0.6];lab=n=>(s>=1&&n%2===0)||(s>=2&&n%3===0)?0.45:1;}
  {// 扇の頂点の五芒星（原点）
    const nb=CELLS.filter(c=>{const[x,y]=xy(c);return x*x+y*y<3;}).map(c=>{const[x,y]=R(c);return Math.atan2(y,x);}).sort((a,b)=>a-b);
    const[X0,Y0]=P([0,0,0,0]),ri=0.618*SC,ro=1.618*SC;ctx.beginPath();
    nb.forEach((t,i)=>{const t2=t+Math.PI/5;const p=[X0+ri*Math.cos(t),Y0-ri*Math.sin(t)],q=[X0+ro*Math.cos(t2),Y0-ro*Math.sin(t2)];i?ctx.lineTo(...p):ctx.moveTo(...p);ctx.lineTo(...q);});
    ctx.closePath();ctx.fillStyle=starCol[0];ctx.globalAlpha=starCol[1];ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=cI;ctx.lineWidth=2.5;ctx.stroke();}
  for(let n=1;n<=top;n++){const[c,a]=colOf(n);DATA.tri0[n-1].forEach(r=>fillRing(r,c,P,a));}
  ctx.textAlign="center";ctx.textBaseline="middle";
  {const[X,Y]=P([0,0,0,0]);ctx.fillStyle=cI;ctx.globalAlpha=f.m==="sieve"?0.45:1;ctx.font="700 17px 'IBM Plex Mono',monospace";ctx.fillText(1,X,Y+1);ctx.globalAlpha=1;}
  for(let n=1;n<=top;n++)DATA.tri0[n-1].forEach(c=>{const[X,Y]=P(c);ctx.globalAlpha=lab(n);ctx.beginPath();ctx.arc(X,Y,13,0,7);ctx.fillStyle=cP;ctx.fill();ctx.fillStyle=cI;ctx.font="700 "+(n>=10?15:18)+"px 'IBM Plex Mono',monospace";ctx.fillText(n,X,Y+1);ctx.globalAlpha=1;});
  if(f.m==="lay"){
    g("ph").textContent=f.n===0?"最初の 1：頂点の五芒星":f.n===1?"2 番目の 1：段 1 の円環":"1 から 13 を並べる";
    g("nn").textContent=f.n===0?"頂点":"段 "+f.n;g("ag").textContent=f.n===0?"五芒星 1 個":"円環 "+f.n+" 個";
    g("tt").textContent=f.n===0?"五芒星 1":"五芒星 1 ＋ 円環 "+(f.n*(f.n+1)/2);}
  if(f.m==="fib"){const[x,y,z]=FIB[f.k];
    g("ph").textContent="2 つを足す（フィボナッチ）";g("nn").textContent=(x===0?"頂点":"段 "+x)+" ＋ 段 "+y+" → 段 "+z;
    g("ag").textContent=(x===0?"五芒星 1":"円環 "+x)+" ＋ 円環 "+y+" ＝ 円環 "+z;
    g("tt").textContent="1, 1"+[2,3,5,8,13].filter(v=>v<=z).map(v=>", "+v).join("");}
  if(f.m==="sieve"){const s=f.s;
    g("ph").textContent=["2 と 3 で篩う","2 の倍数を除く（青）","3 の倍数を除く（緑）","残った段（赤）＝ 素数"][s];
    g("nn").textContent=["段 1〜13","2, 4, 6, 8, 10, 12","3, 9（6, 12 は除き済み）","5, 7, 11, 13"][s];
    g("ag").textContent=["",  "残り 1, 3, 5, 7, 9, 11, 13","残り 1, 5, 7, 11, 13","1 は 2 と 3 で作れない、残る 1"][s];
    g("tt").textContent=s===3?"素数 5, 7, 11, 13":"—";}
}
let n=0,playing=true,acc=0,prev=0;
const speed=document.getElementById("speed"),btn=document.getElementById("play");
function adv(){n=(n+1)%FR.length;draw(FR[n]);}
function loop(t){if(playing){acc+=(t-prev)*speed.value;if(acc>4200){acc=0;adv();}}prev=t;requestAnimationFrame(loop);}
btn.onclick=()=>{playing=!playing;btn.textContent=playing?"停止":"再生";};
document.getElementById("step").onclick=()=>{playing=false;btn.textContent="再生";adv();};
document.getElementById("reset").onclick=()=>{n=0;draw(FR[0]);};
draw(FR[0]);requestAnimationFrame(t=>{prev=t;loop(t);});
</script>
</body>
</html>
